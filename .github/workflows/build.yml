name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Build release APKs
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          gradle :app:assembleRelease :puck-android-auto:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk amp-auto.apk
          cp puck-android-auto/build/outputs/apk/release/puck-android-auto-release.apk puck-auto.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Amp + Puck for Android Auto 0.1.${{ github.run_number }}
          files: |
            amp-auto.apk
            puck-auto.apk
          make_latest: true
